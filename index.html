<style>
/* Layout: one narrow column like a phone screen; risograph print look — two inks (pink + blue) slightly misregistered on cool paper */
:root{
  --paper:#EDEFF5; --card:#F8F9FC; --ink:#1A1D3A; --muted:#5E6385;
  --pink:#F2367F; --blue:#2D57F0; --sun:#FFC93C; --line:#D3D7E6;
  --good:#1F9D6B; --bad:#D9483B;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121429; --card:#1B1E38; --ink:#ECEEFA; --muted:#9CA1C6;
  --pink:#FF6BA4; --blue:#7C98FF; --sun:#FFD25E; --line:#2E3256;
  --good:#4CC995; --bad:#FF7A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121429; --card:#1B1E38; --ink:#ECEEFA; --muted:#9CA1C6;
  --pink:#FF6BA4; --blue:#7C98FF; --sun:#FFD25E; --line:#2E3256;
  --good:#4CC995; --bad:#FF7A6B; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.riso{font-family:var(--display);font-weight:400;line-height:1.15;letter-spacing:.01em;
  text-shadow:2px 2px 0 color-mix(in srgb,var(--pink) 70%,transparent),-1px -1px 0 color-mix(in srgb,var(--blue) 55%,transparent);text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dots{background-image:radial-gradient(color-mix(in srgb,var(--blue) 22%,transparent) 1.2px,transparent 1.4px);background-size:9px 9px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 22px;font-weight:700;
  box-shadow:4px 4px 0 var(--pink);transition:transform .12s, box-shadow .12s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:4px 4px 0 var(--blue)}
.btn.small{padding:7px 14px;font-size:13px;box-shadow:3px 3px 0 var(--blue)}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.hero h1{font-size:clamp(40px,12vw,58px);margin:0}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{margin:0;color:var(--muted);max-width:30em}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s, transform .15s}
.tbtn b{font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.04em}
.tbtn span{font-size:10px;color:var(--muted);line-height:1.3;text-align:center}
.tbtn:hover{border-color:var(--pink);transform:translateY(-2px)}
.tbtn.nt b{color:var(--blue)} .tbtn.nf b{color:var(--pink)} .tbtn.sj b{color:var(--good)} .tbtn.sp b{color:color-mix(in srgb,var(--sun) 70%,var(--ink))}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.quizcta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:16px}
.quizcta p{margin:0;font-size:14px}

/* quiz */
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pink);transition:width .3s}
.qcard{background:var(--card);border-radius:20px;padding:26px 20px;display:flex;flex-direction:column;gap:18px;border:1.5px solid var(--line)}
.qcard h2{font-size:24px;margin:0}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue)}
.opt small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}

/* type card */
.tcard{border-radius:22px;padding:24px 20px;border:2px solid var(--ink);background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--blue)}
.tcard .code{font-family:var(--display);font-size:64px;line-height:1;letter-spacing:.04em;color:var(--pink);text-shadow:3px 3px 0 color-mix(in srgb,var(--blue) 60%,transparent)}
.tcard h2{margin:0;font-size:22px}
.tcard p{margin:0}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.axes div{border:1.5px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);background:var(--paper)}
.axes b{display:block;font-family:var(--mono);font-size:16px;color:var(--ink)}

/* life */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1.5px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.hudtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.age{font-family:var(--display);font-size:44px;line-height:1}
.age small{font-family:var(--body);font-size:15px;margin-left:4px}
.who{text-align:right;font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
.who b{font-family:var(--mono);color:var(--pink);font-size:15px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.bar{display:grid;grid-template-columns:3.2em 1fr 2em;align-items:center;gap:6px;font-size:12px}
.bar .tr{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px;transition:width .4s}
.bar .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:11px;color:var(--muted)}
.money{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.money b{font-family:var(--mono);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.log li{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);animation:pop .35s ease-out}
.log li .y{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.log li .t{min-width:0}
.log li.ms .t{font-weight:700}
.log li.ms .y{color:var(--pink)}
.tag{display:inline-block;font-size:10px;font-family:var(--mono);letter-spacing:.06em;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:2px;border:1px solid currentColor}
.tag.up{color:var(--good)} .tag.dn{color:var(--bad)} .tag.ms{color:var(--pink)}
@keyframes pop{from{transform:translateY(-6px);background:color-mix(in srgb,var(--sun) 25%,transparent)}to{transform:none}}
.choice{background:var(--card);border:2px solid var(--pink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.choice h3{margin:0;font-size:17px}
.choice .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice .opt{display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.like{font-size:10px;font-family:var(--mono);color:var(--pink);letter-spacing:.04em}

/* end */
.grave{border:2px solid var(--ink);border-radius:120px 120px 18px 18px;padding:40px 22px 24px;text-align:center;background:var(--card);box-shadow:6px 6px 0 var(--pink);display:flex;flex-direction:column;gap:10px;align-items:center}
.grave .span{font-family:var(--mono);color:var(--muted);font-size:13px}
.grave h2{margin:0;font-size:26px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;text-align:left}
.facts div{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);min-width:0}
.facts b{display:block;color:var(--ink);font-size:15px;overflow-wrap:anywhere}
.mslist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.mslist li{display:grid;grid-template-columns:3.4em 1fr;gap:8px;font-size:14px}
.mslist li span{font-family:var(--mono);color:var(--pink);font-size:12px;padding-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.share{width:100%;font-size:13px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font-family:var(--body);resize:none}
.xbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#0F1419;color:#fff;border:2px solid #0F1419;border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:4px 4px 0 var(--pink)}
.xbtn svg{width:18px;height:18px;fill:#fff}
.xbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.imgcard{width:100%;border-radius:14px;border:1.5px solid var(--line);display:block;aspect-ratio:1200/675;background:var(--card)}
.steps{margin:0;padding-left:1.3em;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.quick{background:none;border:none;color:var(--blue);text-decoration:underline;padding:4px 0;font-size:14px}
.setup{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-weight:700;font-size:14px}
.agebox{display:flex;align-items:center;gap:14px}
.agebox output{font-family:var(--display);font-size:34px;min-width:2.4em;line-height:1}
.agebox input{flex:1;min-width:0;accent-color:var(--pink)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;background:var(--paper);cursor:pointer}
.seg input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.seg input:disabled+span{opacity:.35;cursor:not-allowed}
.friendcta{background:var(--ink);color:var(--paper);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.friendcta h3{margin:0;font-size:20px}
.friendcta p{margin:0;font-size:14px;opacity:.85}
.friendcta .btn{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:4px 4px 0 var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:15px}
.note{font-size:11px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
const TYPES={
INTJ:{n:'長期計画の黒幕',d:'10年先から逆算して動く、静かな戦略家。'},
INTP:{n:'脳内会議の議長',d:'気になったら原理まで掘る。会話より思考が忙しい。'},
ENTJ:{n:'生まれつきの司令塔',d:'気づけば仕切っている。目標達成が生きがい。'},
ENTP:{n:'屁理屈の天才',d:'議論とアイデアが好物。退屈がいちばんの敵。'},
INFJ:{n:'未来を見通す聞き役',d:'人の本音に気づいてしまう。理想は高く、口数は少なめ。'},
INFP:{n:'夢見る内なる詩人',d:'自分の価値観を大切に、心の中に世界をもつ。'},
ENFJ:{n:'みんなの応援団長',d:'人の可能性を信じて、背中を押さずにいられない。'},
ENFP:{n:'ひらめき花火',d:'好奇心で動く。会う人みんなと友達になれる。'},
ISTJ:{n:'約束を守る番人',d:'決めたことはやり切る。信頼の積み立て王。'},
ISFJ:{n:'縁の下の守り神',d:'気づかれない所で誰かを支えている。'},
ESTJ:{n:'段取りの鬼',d:'ルールと効率で、チームを前に進める。'},
ESFJ:{n:'気配りの幹事',d:'場の空気を読んで、みんなを楽しませる。'},
ISTP:{n:'無口な修理名人',d:'手を動かして理解する。いざという時に頼れる。'},
ISFP:{n:'気まぐれアーティスト',d:'今この瞬間の美しさを感じ取る自由人。'},
ESTP:{n:'即決の勝負師',d:'考えるより先に動く。ピンチほど燃える。'},
ESFP:{n:'ステージの主役',d:'いるだけで場が明るくなる、人生エンジョイ勢。'}
};
const ORDER=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
const grp=t=>t[1]==='N'?(t[2]==='T'?'nt':'nf'):(t[3]==='J'?'sj':'sp');

const QUIZ=[
['休日の理想は？',['友達と予定を詰め込む','E'],['家でひとり、ゆっくり充電','I']],
['好きな話題は？',['今日あった具体的な出来事','S'],['「もしも〇〇だったら」な妄想','N']],
['友達が悩みを相談してきた',['まず解決策を一緒に考える','T'],['まずは気持ちに寄り添う','F']],
['旅行の計画は？',['時間ごとのしおりを作る','J'],['行き先だけ決めて、あとは現地で','P']],
['初対面ばかりの集まりで',['自分から話しかけにいく','E'],['話しかけてもらえると助かる','I']],
['料理をするなら',['レシピどおりに作る','S'],['冷蔵庫を見てなんとなくアレンジ','N']],
['何かを決めるときの基準は',['筋が通っているか','T'],['みんなが気持ちよくいられるか','F']],
['課題やレポートの締め切り',['早めに終わらせて安心したい','J'],['ギリギリで本気が出る','P']],
['考えをまとめるときは',['人に話しながら整理する','E'],['頭の中でじっくり考える','I']],
['信じるのは',['実績と経験','S'],['直感とひらめき','N']],
['言われてうれしいのは',['「頭いいね」','T'],['「やさしいね」','F']],
['部屋の状態は',['だいたい片付いている','J'],['自分だけわかる配置になっている','P']]
];

const JOBS={
nt:['ソフトウェアエンジニア','研究者','戦略コンサルタント','ゲームプランナー','データサイエンティスト'],
nf:['小説家','カウンセラー','グラフィックデザイナー','小学校の先生','NPO職員'],
sj:['市役所職員','看護師','経理担当','銀行員','薬剤師'],
sp:['料理人','美容師','消防士','営業職','カメラマン']};
const JOBS_EARLY={nt:['見習いプログラマー','配信者'],nf:['イラストレーター見習い','保育補助'],sj:['工場の品質管理','事務スタッフ'],sp:['アパレル販売員','職人見習い']};

const R=Math.random, pick=a=>a[Math.floor(R()*a.length)];
const clamp=v=>Math.max(0,Math.min(100,v));
function add(s,k,n){s[k]=clamp(s[k]+n)}
function ms(s,txt){s.ms.push([s.age,txt])}
const fmtMoney=m=>{const neg=m<0;m=Math.abs(Math.round(m));let r=m>=10000?(Math.floor(m/10000)+'億'+(m%10000?(m%10000)+'万':'')):m+'万';return (neg?'-':'')+r+'円'};

/* ---------- events ---------- */
const EV=[
{a:[16,45],max:2,w:{F:1.6,P:1.3},t:'推しができた。生活の中心がライブとグッズになる。',fx:s=>{add(s,'happy',8);s.money-=30}},
{a:[16,35],max:2,w:{I:1.8,P:1.5},t:'ゲームに沼った。気づけば朝。',fx:s=>{add(s,'health',-3);add(s,'happy',5)}},
{a:[18,40],max:3,w:{E:2.2},t:'飲み会をきっかけに友達の輪が一気に広がった。',fx:s=>{add(s,'love',7);add(s,'happy',4)}},
{a:[18,60],max:2,w:{I:1.5,N:1.4,P:1.4},t:'ひとり旅で、少しだけ人生観が変わった。',fx:s=>{add(s,'happy',8);s.money-=20;s.trips++}},
{a:[20,50],max:2,w:{J:1.8,S:1.6},c:s=>s.working,t:'コツコツ勉強して資格を取った。',fx:s=>{add(s,'career',9)}},
{a:[23,55],max:2,w:{T:1.5,P:1.4,E:1.2},c:s=>s.working&&!s.founder,t:'上司と大げんか。気まずい日々が続く。',fx:s=>{add(s,'career',-6);add(s,'happy',-5)}},
{a:[26,58],max:3,w:{J:1.6,T:1.5},c:s=>s.working&&s.career>40&&!s.founder,t:'昇進した。',fx:s=>{add(s,'career',10);add(s,'happy',4)}},
{a:[22,55],max:1,w:{N:1.7,P:1.6},c:s=>s.working,t:'週末の副業が思いのほか当たった。',fx:s=>{s.money+=180;add(s,'happy',5)}},
{a:[22,60],max:1,w:{P:1.8,N:1.4},c:s=>s.money>200,t:'話題の投資に乗ったら、見事に溶けた。',fx:s=>{s.money-=Math.round(s.money*0.3);add(s,'happy',-7)}},
{a:[30,60],max:2,w:{J:2,S:1.6},c:s=>s.money>100,t:'コツコツ続けた積立が、気づけば育っていた。',fx:s=>{s.money+=Math.round(150+s.money*0.15)}},

/* ---------- state ---------- */
let s=null, view='home', qi=0, qa=[], timer=null, speed=1, pending=null, autoSkip=false;

function newLife(type){
  const t={};for(const c of 'EISNTFJP')t[c]=type.includes(c);
  return {type,t,age:18,money:30,health:clamp(80+Math.round(R()*15)),love:35+Math.round(R()*15),career:5,happy:60,
    partner:false,married:false,kids:0,job:null,uni:false,working:false,retired:false,founder:false,house:false,
    trips:0,grand:0,ms:[],log:[],counts:{},dead:false,startAge:18,gradAge:22};
}
function weight(e){
  if(s.age<e.a[0]||s.age>e.a[1])return 0;
  if(e.c&&!e.c(s))return 0;
  if((s.counts[EV.indexOf(e)]||0)>=(e.max||1))return 0;
  let w=e.base||1; if(e.w)for(const k in e.w)if(s.t[k])w*=e.w[k];
  return w;
}
function pickEvent(){
  const ws=EV.map(weight);const tot=ws.reduce((a,b)=>a+b,0);if(!tot)return null;
  let r=R()*tot;for(let i=0;i<EV.length;i++){r-=ws[i];if(r<=0)return EV[i]}return null;
}
function push(text,kind){s.log.push({age:s.age,text,kind})}
function startJob(early){
  const g=grp(s.type);s.job=pick(early?JOBS_EARLY[g]:JOBS[g]);s.working=true;s.career=early?12:20;
  ms(s,s.job+'として働き始めた');push(s.job+'として働き始めた。','ms');
}
function yearly(){
  const kidCost=s.kidsOut?0:s.kids*55;
  if(s.working){s.money+=Math.round(120+s.career*(s.founder&&s.startup?7:4)-190-kidCost)}
  else if(s.retired){s.money+=Math.round(170-150-kidCost/2)}
  else if(s.uni){s.money-=35}
  if(s.age>40)add(s,'health',-(0.7+(s.age>65?1.1:0)+(s.age>80?1:0)));
  if(!s.partner&&!s.married&&s.age>30)add(s,'love',-0.6);
  const target=(s.health+s.love+s.career*.6+Math.min(100,40+s.money/80)+40)/4.3;
  s.happy=clamp(s.happy+(target-s.happy)*0.15);
}
function deathCheck(){
  if(s.age<50)return false;
  const p=0.0018*Math.exp((s.age-55)/8)*(1.7-s.health/100);
  return R()<p||s.age>=108;
}
function step(){
  if(pending||s.dead)return;
  s.age++;
  yearly();
  if(s.age===18&&!s.decided18&&!s.uni&&!s.working){pending=uniChoice();if(!autoSkip)stop();else{const i=pending.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i)}return}
  if(s.uni&&s.age>=s.gradAge){s.uni=false;startJob(false)}
  else if(s.age>=19&&s.age<60&&!s.working&&!s.uni&&!s.retired&&R()<.5){startJob(s.age<23)}
  else if(s.age>=(s.founder?70:63)&&s.working){s.working=false;s.retired=true;ms(s,s.founder?'会社を後進に託して引退':'定年退職した');push(s.founder?'会社を後進に託し、引退した。':'定年退職。花束をもらった。','ms')}
  let n=R()<.8?1:0; if(R()<.28)n++;
  let any=false;
  for(let i=0;i<n;i++){
    const e=pickEvent();if(!e)break;
    s.counts[EV.indexOf(e)]=(s.counts[EV.indexOf(e)]||0)+1;
    if(e.choice){pending=e;any=true;if(!autoSkip)stop();if(autoSkip){resolve(e.o.findIndex(o=>s.t[o.lean])<0?0:e.o.findIndex(o=>s.t[o.lean]))}break}
    const txt=typeof e.t==='function'?e.t(s):e.t;
    const before=s.happy; e.fx(s);
    if(e.ms)ms(s,e.ms);
    push(txt,e.ms?'ms':(s.happy>=before?'up':'dn'));any=true;
  }
  if(!any&&!s.log.some(l=>l.age===s.age)){
    const pool=[];for(const k in FILLER)if(s.t[k])pool.push(...FILLER[k]);push(pick(pool),'')}
  if(!pending&&deathCheck()){s.dead=true;push(s.age+'歳で、静かに人生の幕を閉じた。','ms');stop();setTimeout(()=>{view='end';render()},speed>1?500:1300)}
}
function resolve(i){
  const e=pending;pending=null;
  const r=e.o[i].fx(s);push(e.t+' → '+r,'ms');
  if(view==='life')render();
  if(!autoSkip)play();
}
function play(){stop();timer=setInterval(()=>{step();render()},speed>1?260:850)}
function stop(){clearInterval(timer);timer=null}

function startLife(type,p){
  s=newLife(type);s.age=p.age;s.startAge=p.age;
  const y=Math.max(0,p.age-22);
  s.money=Math.round(30+y*55*(0.6+R()*0.7));
  s.health=clamp(s.health-Math.max(0,p.age-40)*0.8);
  push(`${p.age}歳の今日から、${type}の人生を早送りする。`,'ms');
  if(p.rel!=='single'){s.partner=true;add(s,'love',15)}
  if(p.rel==='married'){s.married=true;add(s,'love',10)}
  s.kids=p.kids;if(p.kids&&p.age>55)s.kidsOut=true;
  if(p.age>18)s.decided18=true;
  if(p.work==='student'&&p.age>=18){s.uni=true;s.gradAge=Math.max(22,p.age+1)}
  if(p.work==='work'){
    if(p.age>=63){s.retired=true}else{const g=grp(type);s.job=pick(JOBS[g]);s.working=true;s.career=clamp(20+y*1.5);push(`いまは${s.job}として働いている。`,'')}
  }
  if(p.work==='none'&&p.age>=63)s.retired=true;
  if(p.age===18)pending=uniChoice();
}

  const rel=s.married?'既婚':s.partner?'恋人あり':'ひとり';
  let ch='';
  if(pending){const e=pending;ch=`<div class="choice"><span class="eyebrow">分かれ道 / ${s.age}歳</span><h3>${e.t}</h3><div class="opts">${e.o.map((o,i)=>`<button class="opt" data-choose="${i}">${o.l}${s.t[o.lean]?`<span class="like">${s.type}らしい選択</span>`:''}</button>`).join('')}</div></div>`}
  return `<div class="hud"><div class="hudtop"><div class="age">${s.age}<small>歳</small></div><div class="who"><b>${s.type}</b><br>${esc(status)}${status?' ・ ':''}${rel}${s.kids?' ・ 子ども'+s.kids+'人':''}</div></div>
  <div class="bars">${bar('健康',s.health,'var(--good)')}${bar('愛情',s.love,'var(--pink)')}${bar('仕事',s.career,'var(--blue)')}${bar('幸福',s.happy,'var(--sun)')}</div>
  <div class="money"><span>貯金</span><b>${fmtMoney(s.money)}</b></div>
  <div class="ctrls">${s.dead?'':`<button class="btn small" data-act="toggle">${timer?'一時停止':'再生'}</button><button class="btn small ghost" data-act="speed">速さ ×${speed}</button><button class="btn small ghost" data-act="skip">最期まで（自動選択）</button>`}</div></div>
  ${ch}
  <ul class="log">${s.log.slice().reverse().map(l=>`<li class="${l.kind==='ms'?'ms':''}"><span class="y">${l.age}歳</span><span class="t">${l.kind==='up'?'<span class="tag up">UP</span>':l.kind==='dn'?'<span class="tag dn">DOWN</span>':''}${esc(l.text)}</span></li>`).join('')}</ul>`;
}
function title(){
  if(s.founder&&s.startup&&s.money>4000)return '一代で会社を育てた人';
  if(s.kids>=2&&s.grand>=1&&s.love>65)return '大家族に囲まれた人';
  if(s.age>=95)return '長生きのレジェンド';
  if(s.trips>=4)return '世界を見てきた旅人';
  if(s.career>=85)return 'その道を極めた人';
  if(s.love>=80)return 'たくさんの人に愛された人';
  if(s.money>=7000)return 'お金には困らなかった人';
  if(s.happy>=75)return '毎日がちょっと楽しかった人';
  if(s.founder&&!s.startup)return '挑戦をおそれなかった人';
  return 'ふつうで、かけがえのない人';
}
const SHARE_URL='https://sumisukekun.github.io/mbti-life/';
function hook(){
  const m=s.ms.filter(x=>!/として働き始めた|大学に進学/.test(x[1]));
  return m.length?m.slice(-2).map(x=>x[0]+'歳で'+x[1]).join('、'):'大きな事件のない穏やかな人生';
}
const BASE=/^https?:/.test(location.protocol)&&location.hostname.endsWith('github.io')?location.origin+location.pathname:SHARE_URL;
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(t){try{t=t.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e){return null}}
function hl3(){return s.ms.filter(x=>!/として働き始めた|大学に進学/.test(x[1])).slice(-3)}
function resultUrl(){return BASE+'?r='+enc({t:s.type,a:s.age,s:s.startAge,ti:title(),j:s.job||'',k:s.kids,m:s.married?1:0,mo:Math.round(s.money),h:hl3()})}
function xText(){
  return `いま${s.startAge}歳の${s.type}の私、享年${s.age}。\n称号は「${title()}」\n${hook()}。\n\nあなたのMBTIはどんな一生？\n#16分の1の人生 #MBTI`;
}
function xUrl(){return 'https://x.com/intent/post?text='+encodeURIComponent(xText())+'&url='+encodeURIComponent(resultUrl())}
function shareText(){
  return xText()+'\n'+resultUrl();
}
let friend=null;
try{const r=new URLSearchParams(location.search).get('r');const o=r&&dec(r);if(o&&TYPES[o.t]&&+o.a>0){friend=o;view='friend'}}catch(e){}
function vFriend(){
  const f=friend,n=v=>Math.max(0,Math.round(+v||0));
  const hs=Array.isArray(f.h)?f.h.slice(0,3):[];
  return `<span class="eyebrow">シェアされた人生</span>
  <div class="grave dots"><span class="eyebrow">${f.t} ・ ${TYPES[f.t].n}</span><span class="span">${n(f.s)}歳から早送り ・ 享年 ${n(f.a)}</span><h2 class="riso">${esc(String(f.ti||'').slice(0,30))}</h2>
  <div class="facts"><div>職業<b>${esc(String(f.j||'—').slice(0,30))}</b></div><div>最終貯金<b>${fmtMoney(+f.mo||0)}</b></div><div>家族<b>${f.m?'結婚':'独身'}</b></div><div>子ども<b>${n(f.k)}人</b></div></div></div>
  ${hs.length?`<section class="sec"><h3>この人生のハイライト</h3><ul class="mslist">${hs.map(m=>`<li><span>${n(m[0])}歳</span>${esc(String(m[1]).slice(0,40))}</li>`).join('')}</ul></section>`:''}
  <div class="friendcta"><h3>あなたのMBTIだと、どんな一生？</h3><p>いまの年齢と状況を入れて、未来を早送り。1分で結果が出ます。</p><button class="btn" data-act="home">自分の人生を見る</button></div>`;
}
function shareTextOld(){
  return `#16分の1の人生\n${s.type}（${TYPES[s.type].n}）の私は、${s.age}歳まで生きて「${title()}」になった。\n職業：${s.job||'—'}／${s.married?'結婚':'独身'}${s.kids?'・子ども'+s.kids+'人':''}／最終貯金 ${fmtMoney(s.money)}\nあなたのタイプは、どんな一生？`;
}
function vEnd(){
  const rel=s.married?'結婚して添い遂げた':s.ms.some(m=>m[1]==='離婚した')?'離婚を経験':s.partner?'恋人と過ごした':'ひとりの時間を愛した';
  return `<div class="grave dots"><span class="eyebrow">${s.type} ・ ${TYPES[s.type].n}</span><span class="span">${s.startAge}歳から早送り ・ 享年 ${s.age}</span><h2 class="riso">${title()}</h2>
  <div class="facts"><div>職業<b>${esc(s.job||'—')}</b></div><div>最終貯金<b>${fmtMoney(s.money)}</b></div><div>家族<b>${rel}</b></div><div>子ども / 孫<b>${s.kids}人 / ${s.grand}人</b></div></div></div>
  <section class="sec"><h3>人生のハイライト</h3><ul class="mslist">${s.ms.map(m=>`<li><span>${m[0]}歳</span>${esc(m[1])}</li>`).join('')||'<li><span>—</span>大きな事件のない、穏やかな人生</li>'}</ul></section>
  <section class="sec"><h3>Xでシェア</h3>
  <img class="imgcard" id="cardimg" alt="${s.type}・享年${s.age}・${esc(title())} の結果カード">
  <div class="row"><button class="btn small" data-act="nshare" id="nshare" hidden>画像つきでシェア</button><button class="btn small ghost" data-act="saveimg">画像を保存</button></div>
  <ol class="steps"><li>「画像を保存」（スマホは画像を長押しでも可）</li><li>「Xでポスト」を押して、保存した画像を添付</li></ol>
  <div class="row"><a class="xbtn" href="${xUrl()}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.8-6.3L6.4 22H3.3l7.3-8.3L1 2h6.3l4.4 5.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z"/></svg>Xでポスト</a><button class="btn small ghost" data-act="copy">文章をコピー</button></div>
  <textarea class="share" id="sharebox" rows="6" readonly>${esc(shareText())}</textarea></section>
  <div class="row"><button class="btn" data-act="begin" data-type="${s.type}">同じ条件でもう一度</button><button class="btn ghost" data-act="home">別のタイプで</button></div>
  <p class="note">同じタイプでも、人生は毎回ちがいます。</p>`;
}
let cardType=null,cardFromQuiz=false;
async function drawCard(){
  const img=document.getElementById('cardimg');if(!img)return;
  try{await Promise.all([document.fonts.load('80px "Dela Gothic One"'),document.fonts.load('700 30px "Zen Kaku Gothic New"'),document.fonts.load('28px "DM Mono"')])}catch(e){}
  const W=1200,H=675,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const P='#F2367F',B='#2D57F0',INK='#1A1D3A',PAPER='#EDEFF5',MUTED='#5E6385';
  const D='"Dela Gothic One","Hiragino Sans",sans-serif',BD='"Zen Kaku Gothic New","Hiragino Sans",sans-serif',M='"DM Mono",monospace';
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(45,87,240,.16)';for(let y=6;y<H;y+=16)for(let x=(y/16%2)*8+6;x<W;x+=16){g.beginPath();g.arc(x,y,2,0,7);g.fill()}
  // card panel
  g.fillStyle=B;g.fillRect(52,52,W-96,H-96);g.fillStyle='#F8F9FC';g.fillRect(40,40,W-96,H-96);
  g.strokeStyle=INK;g.lineWidth=4;g.strokeRect(40,40,W-96,H-96);
  // type code with misregistration
  g.font='150px '+D;g.textBaseline='alphabetic';
  g.fillStyle='rgba(45,87,240,.55)';g.fillText(s.type,84,224);g.fillStyle=P;g.fillText(s.type,78,218);
  g.fillStyle=MUTED;g.font='500 26px '+BD;g.fillText(TYPES[s.type].n+'　｜　いま'+s.startAge+'歳からの未来',84,266);
  // age stamp
  g.save();g.translate(940,150);g.rotate(-0.12);g.strokeStyle=P;g.lineWidth=5;g.beginPath();g.arc(0,0,92,0,7);g.stroke();
  g.fillStyle=P;g.textAlign='center';g.font='26px '+BD;g.fillText('享年',0,-22);g.font='72px '+D;g.fillText(s.age,0,50);g.restore();
  // title
  const tt='「'+title()+'」';let fs=64;g.font=fs+'px '+D;while(g.measureText(tt).width>W-170&&fs>36){fs-=4;g.font=fs+'px '+D}
  g.fillStyle='rgba(242,54,127,.6)';g.fillText(tt,84,366);g.fillStyle=INK;g.fillText(tt,80,362);
  // facts
  g.font='500 24px '+BD;g.fillStyle=MUTED;
  const facts=[['職業',s.job||'—'],['家族',(s.married?'結婚':'独身')+(s.kids?' / 子ども'+s.kids+'人':'')],['貯金',fmtMoney(s.money)]];
  facts.forEach((f,i)=>{const x=84+i*350;g.fillStyle=MUTED;g.font='22px '+BD;g.fillText(f[0],x,420);g.fillStyle=INK;let f2=30;g.font='700 '+f2+'px '+BD;while(g.measureText(f[1]).width>320&&f2>18){f2-=2;g.font='700 '+f2+'px '+BD}g.fillText(f[1],x,458)});
  // highlights
  const hl=s.ms.filter(x=>!/として働き始めた|大学に進学/.test(x[1])).slice(-3);
  g.font='22px '+M;
  hl.forEach((m,i)=>{const y=506+i*32;g.fillStyle=P;g.font='22px '+M;g.fillText(m[0]+'歳',84,y);g.fillStyle=INK;g.font='500 24px '+BD;g.fillText(m[1],160,y)});
  // footer
  g.fillStyle=INK;g.fillRect(40,H-96,W-96,40);g.fillStyle='#fff';g.font='700 22px '+BD;g.textAlign='left';g.fillText('#16分の1の人生',64,H-68);
  g.textAlign='right';g.fillText('あなたのMBTIは、どんな一生？',W-80,H-68);
  img.src=c.toDataURL('image/png');
  try{const nb=document.getElementById('nshare');if(nb&&navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'a.png',{type:'image/png'})]}))nb.hidden=false}catch(e){}
}
function render(){
  app.innerHTML=view==='home'?vHome():view==='quiz'?vQuiz():view==='card'?vCard(cardType,cardFromQuiz):view==='setup'?vSetup(cardType):view==='friend'?vFriend():view==='life'?vLife():vEnd();
  if(view==='setup')syncSetup();
  if(view==='end')drawCard();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,1600)}

app.addEventListener('input',e=>{if(e.target.id==='age')syncSetup()});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.type&&!b.dataset.act){cardType=b.dataset.type;cardFromQuiz=false;view='card';render();scrollTo(0,0);return}
  if(b.dataset.ans){qa.push(b.dataset.ans);qi++;
    if(qi>=QUIZ.length){const c=k=>qa.filter(x=>x===k).length;cardType=(c('E')>=2?'E':'I')+(c('S')>=2?'S':'N')+(c('T')>=2?'T':'F')+(c('J')>=2?'J':'P');cardFromQuiz=true;view='card'}
    render();return}
  if(b.dataset.choose){resolve(+b.dataset.choose);render();return}
  const a=b.dataset.act;
  if(a==='home'){stop();if(friend){friend=null;try{history.replaceState(null,'',location.pathname)}catch(e){}}view='home';render();scrollTo(0,0)}
  if(a==='setup'){cardType=b.dataset.type;view='setup';render();scrollTo(0,0)}
  if(a==='quiz'){qi=0;qa=[];view='quiz';render();scrollTo(0,0)}
  if(a==='begin'){stop();pending=null;autoSkip=false;speed=1;const p=view==='setup'?readSetup():prof;startLife(b.dataset.type,p);
    view='life';render();scrollTo(0,0);if(!pending)play()}
  if(a==='quick'){stop();autoSkip=true;pending=null;startLife(b.dataset.type,readSetup());
    if(pending){const i=pending.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i)}
    let guard=0;while(!s.dead&&guard++<200){step()}
    view='end';render();scrollTo(0,0);return}
  if(a==='saveimg'){const im=document.getElementById('cardimg');if(!im.src)return;const l=document.createElement('a');l.href=im.src;l.download='16bun1_'+s.type+'_'+s.age+'.png';document.body.appendChild(l);l.click();l.remove();toast('画像を保存しました');return}
  if(a==='nshare'){const im=document.getElementById('cardimg');fetch(im.src).then(r=>r.blob()).then(bl=>{const f=new File([bl],'16bun1.png',{type:'image/png'});return navigator.share({files:[f],text:shareText()})}).catch(()=>{});return}
  if(a==='toggle'){timer?stop():play();render()}
  if(a==='speed'){speed=speed===1?4:1;if(timer)play();render()}
  if(a==='skip'){autoSkip=true;speed=4;if(pending){const e=pending;const i=e.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i)}play();render()}
  if(a==='copy'){const t=shareText();const box=document.getElementById('sharebox');
    navigator.clipboard?.writeText(t).then(()=>toast('コピーしました'),()=>{box.select();toast('選択しました。長押しでコピーしてください')})??(box.select(),toast('選択しました'))}
});
render();
</script>
