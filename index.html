<style>
/* Layout: one narrow column like a phone screen; risograph print look — two inks (pink + blue) slightly misregistered on cool paper */
:root{
  --paper:#EDEFF5; --card:#F8F9FC; --ink:#1A1D3A; --muted:#5E6385;
  --pink:#F2367F; --blue:#2D57F0; --sun:#FFC93C; --line:#D3D7E6;
  --good:#1F9D6B; --bad:#D9483B;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121429; --card:#1B1E38; --ink:#ECEEFA; --muted:#9CA1C6;
  --pink:#FF6BA4; --blue:#7C98FF; --sun:#FFD25E; --line:#2E3256;
  --good:#4CC995; --bad:#FF7A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121429; --card:#1B1E38; --ink:#ECEEFA; --muted:#9CA1C6;
  --pink:#FF6BA4; --blue:#7C98FF; --sun:#FFD25E; --line:#2E3256;
  --good:#4CC995; --bad:#FF7A6B; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.riso{font-family:var(--display);font-weight:400;line-height:1.15;letter-spacing:.01em;
  text-shadow:2px 2px 0 color-mix(in srgb,var(--pink) 70%,transparent),-1px -1px 0 color-mix(in srgb,var(--blue) 55%,transparent);text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dots{background-image:radial-gradient(color-mix(in srgb,var(--blue) 22%,transparent) 1.2px,transparent 1.4px);background-size:9px 9px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 22px;font-weight:700;
  box-shadow:4px 4px 0 var(--pink);transition:transform .12s, box-shadow .12s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:4px 4px 0 var(--blue)}
.btn.small{padding:7px 14px;font-size:13px;box-shadow:3px 3px 0 var(--blue)}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.hero h1{font-size:clamp(40px,12vw,58px);margin:0}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{margin:0;color:var(--muted);max-width:30em}
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tbtn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s, transform .15s}
.tbtn b{font-family:var(--mono);font-weight:500;font-size:15px;letter-spacing:.04em}
.tbtn span{font-size:10px;color:var(--muted);line-height:1.3;text-align:center}
.tbtn:hover{border-color:var(--pink);transform:translateY(-2px)}
.tbtn.nt b{color:var(--blue)} .tbtn.nf b{color:var(--pink)} .tbtn.sj b{color:var(--good)} .tbtn.sp b{color:color-mix(in srgb,var(--sun) 70%,var(--ink))}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.quizcta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1.5px dashed var(--line);border-radius:16px;padding:16px}

.opt small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}

/* type card */
.tcard{border-radius:22px;padding:24px 20px;border:2px solid var(--ink);background:var(--card);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--blue)}
.tcard .code{font-family:var(--display);font-size:64px;line-height:1;letter-spacing:.04em;color:var(--pink);text-shadow:3px 3px 0 color-mix(in srgb,var(--blue) 60%,transparent)}
.tcard h2{margin:0;font-size:22px}
.tcard p{margin:0}
.axes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.axes div{border:1.5px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);background:var(--paper)}

/* life */
.wrap.wide{max-width:1180px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;border-bottom:1.5px solid var(--line)}
.tleft{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:16px}.brand em{font-style:normal;color:var(--pink)}
.tage{font-family:var(--display);font-size:36px;line-height:1}.tage small{font-family:var(--body);font-size:14px;margin-left:2px}
.tmeta{font-size:12px;color:var(--muted);min-width:0}
.tctrl{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:4px;scrollbar-width:none}
.sp{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px}
.sp.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sp:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.tprog{flex-basis:100%;height:3px;background:var(--line)}.tprog i{display:block;height:100%;background:var(--pink);transition:width .3s}
.lifegrid{display:flex;flex-direction:column;gap:16px}
.lifegrid .col{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}

  .lifegrid{display:grid;grid-template-columns:270px minmax(0,1fr) 290px;align-items:start}
  .lifegrid .col{display:flex;flex-direction:column;gap:16px;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
  .lifegrid .col.center{position:static}
}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline}.ph h3{margin:0;font-size:16px}.ph span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.idcard{padding:0;overflow:hidden;gap:0}
.idhead{display:flex;justify-content:space-between;background:color-mix(in srgb,var(--pink) 75%,var(--ink));color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:8px 14px}
.idbody{display:flex;gap:14px;padding:14px}
.ava{width:76px;height:76px;flex:none;border-radius:8px;border:1.5px solid var(--line);shape-rendering:crispEdges}
.idinfo{min-width:0}.idinfo h3{margin:0 0 6px;font-size:17px}
.idinfo dl,.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.idinfo dt,.kv dt{color:var(--muted)}.idinfo dd,.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.mrz{font-family:var(--mono);font-size:10px;color:var(--muted);border-top:1px dashed var(--line);padding:10px 14px;letter-spacing:.06em;overflow:hidden;white-space:nowrap}
.decision{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--pink)}
.dhead{display:flex;justify-content:space-between}.pinkish{color:var(--pink)}
.dtitle{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,30px);line-height:1.25;text-wrap:balance}
.dbody{margin:0;font-size:15px;line-height:1.9}
.dnote{margin:0;font-size:13px;line-height:1.7;background:color-mix(in srgb,var(--good) 12%,var(--card));border-left:3px solid var(--good);padding:10px 12px;border-radius:0 8px 8px 0}
.dopts{display:flex;flex-direction:column;gap:8px}
.dopt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;transition:border-color .15s,transform .15s}
.dopt:hover{border-color:var(--pink);transform:translateX(3px)}
.dopt .num{font-family:var(--mono);color:var(--muted);font-weight:400;width:1em}.dopt .lbl{flex:1}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li.yr{display:grid;grid-template-columns:4.2em 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log li.new{animation:pop .45s ease-out}
.yh{display:flex;flex-direction:column;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.yh b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.log li.big .yh b{color:var(--pink)}
.yb{display:flex;flex-direction:column;gap:4px;min-width:0}.yb p{margin:0}
.nar{color:var(--muted);font-size:14px}
.ev{font-size:14px}.ev.ms{font-weight:700}
.evch{font-weight:700;font-size:14px;background:color-mix(in srgb,var(--pink) 10%,transparent);border-radius:8px;padding:6px 10px}
.lmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:3px}
.lmap i,.maplg i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line);opacity:.55}
.lmap i.on,.maplg i.on{opacity:1;background:color-mix(in srgb,var(--good) calc(var(--h,50)*1%),var(--bad))}
.lmap i.ms,.maplg i.ms{box-shadow:inset 0 0 0 2.5px var(--pink)}
.lmap i.now{outline:2px solid var(--ink);outline-offset:1px}
.maplg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0;font-size:11px;color:var(--muted)}.maplg i{width:12px}
.logp{min-height:200px}
.o0{order:0}
.scene{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--ink);background:#CFEBFF}
.scene canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;image-rendering:pixelated;image-rendering:crisp-edges}
.scap{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.scap .chip{background:rgba(26,29,58,.82);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.scap .say{background:rgba(255,255,255,.92);color:#1A1D3A;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;max-width:100%;box-shadow:0 2px 0 rgba(0,0,0,.15)}
@media (min-width:980px){.scene canvas{aspect-ratio:2/1}}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1.5px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.hudtop{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.age{font-family:var(--display);font-size:44px;line-height:1}
.age small{font-family:var(--body);font-size:15px;margin-left:4px}
.who{text-align:right;font-size:12px;color:var(--muted);line-height:1.4;min-width:0}
.who b{font-family:var(--mono);color:var(--pink);font-size:15px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.bar{display:grid;grid-template-columns:3.2em 1fr 2em;align-items:center;gap:6px;font-size:12px}
.bar .tr{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:8px;transition:width .4s}
.bar .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:11px;color:var(--muted)}
.money{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.money b{font-family:var(--mono);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.tag{display:inline-block;font-size:10px;font-family:var(--mono);letter-spacing:.06em;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:2px;border:1px solid currentColor}
.tag.up{color:var(--good)} .tag.dn{color:var(--bad)} .tag.ms{color:var(--pink)}
@keyframes pop{from{transform:translateY(-6px);background:color-mix(in srgb,var(--sun) 25%,transparent)}to{transform:none}}
.choice{background:var(--card);border:2px solid var(--pink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.choice h3{margin:0;font-size:17px}
.choice .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice .opt{display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.like{font-size:10px;font-family:var(--mono);color:var(--pink);letter-spacing:.04em}

/* end */
.grave{border:2px solid var(--ink);border-radius:120px 120px 18px 18px;padding:40px 22px 24px;text-align:center;background:var(--card);box-shadow:6px 6px 0 var(--pink);display:flex;flex-direction:column;gap:10px;align-items:center}
.grave .span{font-family:var(--mono);color:var(--muted);font-size:13px}
.grave h2{margin:0;font-size:26px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;text-align:left}
.facts div{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);min-width:0}
.facts b{display:block;color:var(--ink);font-size:15px;overflow-wrap:anywhere}
.mslist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.mslist li{display:grid;grid-template-columns:3.4em 1fr;gap:8px;font-size:14px}

.row{display:flex;gap:10px;flex-wrap:wrap}
.share{width:100%;font-size:13px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font-family:var(--body);resize:none}
.xbtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#0F1419;color:#fff;border:2px solid #0F1419;border-radius:999px;padding:12px 22px;font-weight:700;box-shadow:4px 4px 0 var(--pink)}

.xbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.imgcard{width:100%;border-radius:14px;border:1.5px solid var(--line);display:block;aspect-ratio:1200/675;background:var(--card)}
.steps{margin:0;padding-left:1.3em;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.quick{background:none;border:none;color:var(--blue);text-decoration:underline;padding:4px 0;font-size:14px}
.setup{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field>span{font-weight:700;font-size:14px}
.agebox{display:flex;align-items:center;gap:14px}
.agebox output{font-family:var(--display);font-size:34px;min-width:2.4em;line-height:1}

.seg{display:flex;flex-wrap:wrap;gap:8px}

.sel:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grp{display:flex;flex-direction:column;gap:18px}

.rates i{font-style:normal;color:var(--ink);font-weight:700;font-size:14px}

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
const TYPES={
INTJ:{n:'長期計画の黒幕',d:'10年先から逆算して動く、静かな戦略家。'},

function weight(e){
  if(s.age<e.a[0]||s.age>e.a[1])return 0;

}

function narr(){
  const k=s.uni?'uni':s.working?(s.age<35?'young':s.age<55?'mid':'late'):s.retired?'retired':s.homemaker?'home':'idle';
  const out=[pick(NARR[k])];

  else if(R()<.45){const c=pick([...s.type]);out.push(TYPEFLAV[c])}

function startJob(early){

function yearly(){
  const kidCost=s.kidsOut?0:s.kids*55;
  const home=s.atHome&&!s.married?-50:0;
  if(s.working){if(!s.income)s.income=300;
    if(s.age<50)s.income=Math.round(s.income*(1+0.008*((EDU[s.edu]||EDU.hs)[2])));
    s.maxIncome=Math.max(s.maxIncome||0,s.income);
    s.money+=Math.round(s.income*0.78-(120+s.income*0.42)-kidCost-home)}
  else if(s.retired){s.money+=Math.round((s.pension||150)-160-kidCost/2)}
  else if(s.homemaker){s.money+=Math.round((s.married?60:-60)-kidCost/3)}

  else if(s.uni){s.money-=35}

  const target=(s.health+s.love+s.career*.6+Math.min(100,40+s.money/80)+40)/4.3;

  let n=R()<.8?1:0; if(R()<.28)n++;

  for(let i=0;i<n;i++){
    const e=pickEvent();if(!e)break;
    s.counts[EV.indexOf(e)]=(s.counts[EV.indexOf(e)]||0)+1;
    if(e.choice){pending=e;any=true;if(!autoSkip)stop();if(autoSkip){resolve(e.o.findIndex(o=>s.t[o.lean])<0?0:e.o.findIndex(o=>s.t[o.lean]))}break}

    const before=s.happy; e.fx(s);
    if(e.ms)ms(s,e.ms);
    push(txt,e.ms?'ms':(s.happy>=before?'up':'dn'));any=true;
  }

}
function resolve(i){
  const e=pending;pending=null;untilChoice=false;

  if(!autoSkip&&!s.dead)play();
}

  {l:'大学に進む',lean:'N',fx:x=>{x.decided18=true;x.uni=true;x.edu='univ';x.gradAge=22;ms(x,'大学に進学');return '大学に進学した。'}},
  {l:'すぐに働く',lean:'S',fx:x=>{x.decided18=true;x.edu='hs';add(x,'happy',3);startJob(true);return '社会に出ることを選んだ。'}},
  {l:'専門学校で技術を身につける',lean:'J',fx:x=>{x.decided18=true;x.uni=true;x.edu='vo';x.gradAge=20;ms(x,'専門学校に進学');return '専門学校に進んだ。手に職をつけるつもりだ。'}},
  {l:'1年かけて考える',lean:'P',fx:x=>{x.decided18=true;x.edu='hs';add(x,'happy',3);return 'ひとまず1年、いろいろ試してみることにした。'}}]}}
function startLife(type,p){
  s=newLife(type);s.age=p.age;s.startAge=p.age;
  push(`${p.age}歳の今日から、${type}の人生を早送りする。`,'ms');
  if(p.status==='student'){
    if(p.rel==='partner'){s.partner=true;add(s,'love',12)}
    if(p.school==='jh'||p.school==='hs'){s.edu='hs';if(p.age>=18)pending=uniChoice()}
    else{s.edu=p.school;s.decided18=true;s.uni=true;s.gradAge=Math.max({vo:20,jc:20,univ:22,grad:24}[p.school],p.age+1)}
    s.money=Math.round(10+Math.max(0,p.age-18)*15);
    return;
  }
  s.decided18=true;s.edu=p.edu;
  s.money=SAV[+p.sav][2];
  s.health={good:90,mid:75,weak:50}[p.health]-Math.max(0,p.age-40)*0.6;s.health=clamp(s.health);
  if(p.mar==='partner'){s.partner=true;add(s,'love',12)}
  if(p.mar==='married'){s.partner=true;s.married=true;s.marriedAt=Math.max(20,p.age-5);add(s,'love',22)}
  if(p.mar==='divorced'){add(s,'love',-5);push('離婚を経験して、いまはひとりで暮らしている。','')}
  s.kids=p.kids;for(let i=0;i<p.kids;i++){const ka=Math.max(0,p.age-28-i*3);s.kidAges.push(p.age-ka)}if(p.kids&&p.age>55)s.kidsOut=true;if(p.kids&&p.age>45)s.noKids=false;
  if(p.home==='own')s.house=true;if(p.home==='parents')s.atHome=true;
  if(p.status==='work'){
    const cat=JOBCAT.find(j=>j[0]===p.job)||JOBCAT[0];
    s.job=cat[1].replace(/（.*?）/,'');s.jobGrp=JOBGRP[p.job];s.working=true;
    s.income=INC[+p.inc][2];s.maxIncome=s.income;
    s.career=clamp(Math.round((s.income-120)/12));
    if(p.job==='owner'){s.founder=true;s.startup=true}
    if(p.age>=(s.founder?70:63))s.retireAt=p.age+2;
    push(`いまは${s.job}として働いている。年収はだいたい${INC[+p.inc][1]}。`,'');
  }else{
    if(p.sit==='home'){s.homemaker=true;add(s,'love',6)}
    if(p.sit==='leave'){s.onLeave=true;s.prevJob='元の職場';s.income=300;add(s,'health',-6)}
    if(p.sit==='retired'||p.age>=65){s.retired=true;s.pension=150}
  }
}

const SW=192,SH=96,GY=78;
function sceneInfo(){
  if(s.dead)return {place:'grave',label:'永遠の眠り'};
  if(s.health<30)return {place:'hospital',label:'病院'};
  if(s.uni)return {place:'school',label:'キャンパス'};
  if(s.working)return {place:s.founder?'tower':'office',label:s.founder?'自分の会社':'職場'};
  if(s.retired)return {place:'park',label:'公園'};
  return {place:'home',label:s.house?'わが家':'自宅'};
}

function season(){return (s.age-s.startAge)%4}
function scenePeople(){

  const g=grp(s.type),shirt={nt:'#3D6BFF',nf:'#F2367F',sj:'#1F9D6B',sp:'#F2A20C'}[g];

  if(s.partner||s.married)ppl.push({a:s.age,shirt:'#8E6CF0',hair:hair(s.age),long:true});

  for(let i=0;i<Math.min(2,s.grand);i++)ppl.push({a:3+i*2,shirt:'#FF8FB1',hair:'#3A2A20'});

function px(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h)}
function drawPerson(c,x,p,t,i){
  const k=p.a<4?.5:p.a<10?.66:p.a<15?.85:1;const bob=(Math.floor(t/400+i)%2)*(p.a>75?0:1);
  const H=Math.round(16*k),hw=Math.max(3,Math.round(5*k)),y=GY-H-bob;
  px(c,x,y,hw,hw,'#F3C9A6');                       // 顔
  px(c,x,y-1,hw,2,p.hair);                          // 髪
  if(p.long)px(c,x-1,y,1,hw+2,p.hair),px(c,x+hw,y,1,hw+2,p.hair);
  px(c,x+1,y+Math.round(hw/2),1,1,'#2B2233');       // 目
  const bh=Math.round(7*k);px(c,x-1,y+hw,hw+2,bh,p.shirt); // 服
  px(c,x,y+hw+bh,1,H-hw-bh+bob,'#3B3B4F');px(c,x+hw-1,y+hw+bh,1,H-hw-bh+bob,'#3B3B4F'); // 脚
  if(p.a>=75&&p.main){px(c,x+hw+2,y+hw,1,H-hw+bob,'#7A5230')} // 杖
  if(p.tie)px(c,x+Math.floor(hw/2),y+hw,1,4,'#E5484D');
  if(p.veil){px(c,x-1,y-2,hw+2,2,'#FFFFFF');px(c,x-2,y,1,H-4,'rgba(255,255,255,.85)');px(c,x-1,y+hw,hw+2,H-hw,'#FFFFFF')}
  if(p.tear){const d=Math.floor(t/200)%4;px(c,x,y+3+d,1,1,'#4CC9F0');px(c,x+hw-1,y+3+((d+2)%4),1,1,'#4CC9F0')}
}

function drawScene(c,t){
  const sp=sceneEvent();if(sp){drawSpecial(c,t,sp.key);return}
  const se=season(),h=s.happy,dead=s.dead;
  const skyTop=dead?'#F6A57B':h<35?'#7E8AA6':['#FFD6E5','#7FC8FF','#FFC48A','#C9D7EA'][se];
  const skyBot=dead?'#FBD9B4':h<35?'#B2BACB':['#FFF2F7','#CFEBFF','#FFE7C9','#EEF3FA'][se];
  const gr=c.createLinearGradient(0,0,0,GY);gr.addColorStop(0,skyTop);gr.addColorStop(1,skyBot);c.fillStyle=gr;c.fillRect(0,0,SW,GY);

  px(c,0,GY,SW,SH-GY,dead?'#8DB27E':['#8FD18A','#5DBB63','#C9A15A','#F4F7FB'][se]);px(c,0,GY,SW,2,'rgba(0,0,0,.08)');

  if(h<35&&!dead)for(let k=0;k<26;k++){const rx=(k*29+t/6)%SW,ry=(k*17+t/3)%GY;px(c,rx,ry,1,3,'rgba(80,110,170,.55)')}
  const pl=sceneInfo().place;drawPlace(c,pl,t);
  if(!dead){const ppl=scenePeople();let x=26;ppl.forEach((p,i)=>{drawPerson(c,x,p,t,i);x+=p.a<10?8:11});

function sceneEvent(){
  if(!s||s.dead)return null;
  const ev=s.log.filter(l=>l.age===s.age&&l.kind!=='nar').map(l=>l.kind==='ch'?l.text.split(' ― ').pop():l.text);
  if(!ev.length)return null;
  for(const [re,key,label] of SCN)if(ev.some(t=>re.test(t)))return {key,label};
  return null;
}

let sceneRAF=0;
function sceneLoop(t){sceneRAF=0;if(view!=='life'||!s)return;const cv=document.getElementById('scene');
  if(cv){const c=cv.getContext('2d');c.imageSmoothingEnabled=false;drawScene(c,t)}
  sceneRAF=requestAnimationFrame(sceneLoop)}
function startScene(){if(!sceneRAF)sceneRAF=requestAnimationFrame(sceneLoop)}
function sceneHtml(){
  const si=sceneEvent()||sceneInfo();const last=[...s.log].reverse().find(l=>l.kind!=='nar');
  const cap=last&&last.age===s.age?last.text:'';
  return `<section class="scene o0"><canvas id="scene" width="${SW}" height="${SH}" role="img" aria-label="${s.age}歳の情景：${si.label}"></canvas>
    <div class="scap"><span class="chip">${s.dead?'享年 '+s.age:s.age+'歳'} · ${SEASONS[season()]} · ${si.label}</span>${cap?`<span class="say">${esc(cap)}</span>`:''}</div></section>`;
}

const YEAR0=new Date().getFullYear();
const yearOf=age=>YEAR0+(age-s.startAge);
function avatar(){
  let x=s.seed||1;const r=()=>{x=(x*1103515245+12345)%2147483648;return x/2147483648};
  const col={nt:'var(--blue)',nf:'var(--pink)',sj:'var(--good)',sp:'var(--sun)'}[grp(s.type)];
  let rects='';for(let y=0;y<7;y++)for(let i=0;i<4;i++){if(r()<.55){const xs=i===3?[3]:[i,6-i];xs.forEach(xx=>rects+=`<rect x="${xx}" y="${y}" width="1" height="1"/>`)}}
  return `<svg class="ava" viewBox="-1 -1 9 9" aria-hidden="true"><rect x="-1" y="-1" width="9" height="9" fill="var(--paper)"/><g fill="${col}">${rects}</g></svg>`;
}
function phase(){return s.dead?'—':s.uni?((EDU[s.edu]||EDU.univ)[0]+'の学生'):s.working?(s.founder?'経営者':s.job):s.retired?'引退後の暮らし':s.homemaker?'専業主婦・主夫':'求職中'}
function kidLabel(){if(!s.kids)return 'いない';
  const ages=s.kidAges.slice(0,s.kids).map(b=>s.age-b).filter(a=>a>=0);
  const nm=['長子','次子','三子','四子'];return ages.length?ages.map((a,i)=>`${nm[i]||'末子'} ${a}歳`).join(' · '):s.kids+'人'}
function vLife(){
  const T=TYPES[s.type];
  const rel=s.married?`既婚${s.marriedAt?'（結婚'+(s.age-s.marriedAt)+'年）':''}`:s.partner?(s.cohabit?'恋人と同居':'恋人あり'):'ひとり';
  const home=s.house?'持ち家':s.atHome?'実家':'賃貸';
  // decision
  let dec='';
  if(pending){const e=pending;dec=`<section class="decision" aria-live="polite">
    <div class="dhead"><span class="eyebrow pinkish">大きな決断</span><span class="eyebrow pinkish">${s.age}歳 · ${yearOf(s.age)}年</span></div>
    <h2 class="dtitle">${s.age}歳、${esc(e.h)}</h2>
    <p class="dbody">${esc(e.body||'')}</p>
    ${e.note?`<p class="dnote">${esc(e.note)}</p>`:''}
    <div class="dopts">${e.o.map((o,i)=>`<button class="dopt" data-choose="${i}"><span class="num">${i+1}</span><span class="lbl">${esc(o.l)}</span>${s.t[o.lean]?`<span class="like">${s.type}らしい</span>`:''}</button>`).join('')}</div>
    <button class="btn small ghost" data-act="auto" style="align-self:center">これからの決断をおまかせにする</button></section>`}
  // log grouped by year
  const groups=[];for(const l of s.log){const g=groups[groups.length-1];if(g&&g.age===l.age)g.items.push(l);else groups.push({age:l.age,items:[l]})}
  const logHtml=groups.slice().reverse().map((g,gi)=>`<li class="yr${gi===0?' new':''}${g.items.some(x=>x.kind==='ms'||x.kind==='ch')?' big':''}"><div class="yh"><b>${g.age}歳</b><span>${yearOf(g.age)}年</span></div><div class="yb">${g.items.map(x=>
     x.kind==='nar'?`<p class="nar">${esc(x.text)}</p>`:x.kind==='ch'?`<p class="evch">${esc(x.text)}</p>`:`<p class="ev ${x.kind}">${x.kind==='up'?'<span class="tag up">UP</span>':x.kind==='dn'?'<span class="tag dn">DOWN</span>':''}${esc(x.text)}</p>`).join('')}</div></li>`).join('');
  // life map
  const end=s.dead?s.age:Math.max(100,s.age+1);let cells='';
  const msAges=new Set(s.ms.map(m=>m[0]));
  for(let a=s.startAge;a<=end;a++){const i=a-s.startAge-1;const h=a===s.startAge?null:s.hist[i];
    const lived=a<=s.age;const st=lived&&h!=null?`style="--h:${h}"`:'';
    cells+=`<i class="${lived?'on':''}${msAges.has(a)?' ms':''}${a===s.age?' now':''}" ${st} title="${a}歳${lived&&h!=null?' · 幸福'+h:''}"></i>`}
  const spd=[1,2,4,8].map(v=>`<button class="sp${speed===v&&!untilChoice?' on':''}" data-speed="${v}">${v}×</button>`).join('');
  return `<header class="topbar">
    <div class="tleft"><span class="brand">16分の<em>1</em></span><span class="tage">${s.age}<small>歳</small></span><span class="tmeta">${yearOf(s.age)}年 · ${s.type} · ${esc(phase())}</span></div>
    <div class="tctrl">${s.dead?`<button class="btn small" data-act="toend">結果を見る</button>`:`
      <button class="sp" data-act="toggle">${timer?'❚❚ 一時停止':'▶ 再生'}</button>${spd}
      <button class="sp${untilChoice?' on':''}" data-act="next">次の決断まで »</button>
      <button class="sp${autoSkip?' on':''}" data-act="autotoggle">おまかせ${autoSkip?' ON':''}</button>
      <button class="sp" data-act="skip">最期まで</button>`}</div>
    <div class="tprog"><i style="width:${Math.min(100,(s.age-s.startAge)/(Math.max(100,s.age)-s.startAge)*100)}%"></i></div></header>
  <div class="lifegrid">
    <div class="col">
      <section class="panel idcard o2"><div class="idhead"><span>人生記録 · ${s.type}</span><span>${yearOf(s.startAge)}</span></div>
        <div class="idbody">${avatar()}<div class="idinfo"><h3>${T.n}</h3><dl>
          <dt>スタート</dt><dd>${s.startAge}歳 · ${yearOf(s.startAge)}年</dd>
          <dt>いま</dt><dd>${esc(phase())}</dd>
          <dt>学歴</dt><dd>${(EDU[s.edu]||EDU.hs)[0]}${s.uni?'（在学中）':''}</dd>
          <dt>住まい</dt><dd>${home}</dd></dl></div></div>
        <div class="mrz">L&lt;16BUN1&lt;&lt;${s.type}&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;${yearOf(s.startAge)}<br>${String(s.seed).padStart(9,'0').slice(0,9)}&lt;JPN&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div></section>
      <section class="panel o3"><div class="ph"><h3>状態</h3><span>0–100</span></div>
        <div class="bars">${bar('健康',s.health,'var(--good)')}${bar('幸福',s.happy,'var(--sun)')}${bar('愛情',s.love,'var(--pink)')}${bar('仕事',s.career,'var(--blue)')}</div>
        <div class="money"><span>貯金 <b>${fmtMoney(s.money)}</b></span><span>${s.working&&s.income?'年収 <b>'+fmtMoney(s.income)+'</b>':s.retired?'年金ぐらし':s.uni?'学生':''}</span></div></section>
    </div>
    <div class="col center">
      ${sceneHtml()}
      ${dec?`<div class="o1">${dec}</div>`:''}
      <section class="panel o6 logp"><div class="ph"><h3>人生の記録</h3><span>新しい順</span></div><ol class="log">${logHtml}</ol></section>
    </div>
    <div class="col">
      <section class="panel o4"><div class="ph"><h3>家族と暮らし</h3></div><dl class="kv">
        <dt>パートナー</dt><dd>${rel}</dd>
        <dt>子ども</dt><dd>${kidLabel()}</dd>
        ${s.grand?`<dt>孫</dt><dd>${s.grand}人</dd>`:''}
        <dt>住まい</dt><dd>${home}</dd>
        ${s.pet?'<dt>ペット</dt><dd>猫</dd>':''}
        <dt>仕事</dt><dd>${esc(phase())}</dd></dl></section>
      <section class="panel o5"><div class="ph"><h3>人生地図</h3><span>1マス＝1年</span></div><div class="lmap">${cells}</div>
        <p class="maplg"><i class="on" style="--h:20"></i>つらい <i class="on" style="--h:85"></i>しあわせ <i class="on ms" style="--h:60"></i>大きな出来事</p></section>
    </div>
  </div>`;
}
const TITLES=["一代で会社を育てた人","大家族に囲まれた人","長生きのレジェンド","世界を見てきた旅人","その道を極めた人","たくさんの人に愛された人","お金には困らなかった人","毎日がちょっと楽しかった人","挑戦をおそれなかった人","ふつうで、かけがえのない人"];
function title(){
  if(s.founder&&s.startup&&s.money>4000)return '一代で会社を育てた人';
  if(s.kids>=2&&s.grand>=1&&s.love>65)return '大家族に囲まれた人';
  if(s.age>=95)return '長生きのレジェンド';
  if(s.trips>=4)return '世界を見てきた旅人';
  if(s.career>=85)return 'その道を極めた人';
  if(s.love>=80)return 'たくさんの人に愛された人';
  if(s.money>=7000)return 'お金には困らなかった人';
  if(s.happy>=75)return '毎日がちょっと楽しかった人';
  if(s.founder&&!s.startup)return '挑戦をおそれなかった人';
  return 'ふつうで、かけがえのない人';
}
const TIP_URL=''; // 投げ銭ページのURL（OFUSE / Ko-fi など）を入れると結果画面に応援ボタンが出る
const SHARE_URL='https://mbti.businessmaker.net/';
function hook(){
  const m=s.ms.filter(x=>!/として働き始めた|大学に進学/.test(x[1]));
  return m.length?m.slice(-2).map(x=>x[0]+'歳で'+x[1]).join('、'):'大きな事件のない穏やかな人生';
}
const BASE=/^https?:/.test(location.protocol)&&/github\.io$|businessmaker\.net$/.test(location.hostname)?location.origin+location.pathname:SHARE_URL;
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(t){try{t=t.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(t))))}catch(e){return null}}
function hl3(){return s.ms.filter(x=>!/として働き始めた|大学に進学/.test(x[1])).slice(-3)}
/* ---- シェア用：個人情報を出さない「イメージ」表現 ---- */
const RATE_LABEL={work:['仕事運',['のんびり','ほどほど','安定','活躍','大成功']],money:['金運',['波乱万丈','慎ましく','まずまず','ゆとり','豪快']],love:['愛情運',['孤高','マイペース','あたたか','満ちあふれ','愛されすぎ']],health:['健康運',['太く短く','ほどほど','健やか','丈夫','鉄人']]};
const c15=v=>Math.max(1,Math.min(5,Math.round(v)));
function ratings(){
  const mi=s.maxIncome||0;
  return {work:c15(mi>=1000?5:s.career/20+0.6),money:c15(s.money<0?1:s.money<500?2:s.money<2000?3:s.money<6000?4:5),
    love:c15(s.love/22+(s.married?1:0)+(s.kids?0.5:0)),health:c15(s.age<70?1:s.age<78?2:s.age<86?3:s.age<94?4:5)};
}
const KW=[[/起業/,'挑戦'],[/海外|世界一周/,'冒険'],[/結婚|恋人/,'愛'],[/子ども|孫/,'家族'],[/家を買った/,'安定'],[/移住/,'スローライフ'],[/出版/,'表現'],[/転職/,'転機'],[/離婚/,'再出発'],[/復帰/,'再起'],[/退職|引退/,'ひと区切り']];
const TYPEKW={E:'仲間',I:'ひとり時間',S:'コツコツ',N:'ひらめき',T:'信念',F:'やさしさ',J:'計画',P:'自由'};
function keywords(){
  const out=[];
  for(const [re,w] of KW){if(out.length>=3)break;if(s.ms.some(m=>re.test(m[1]))&&!out.includes(w))out.push(w)}
  for(const c of s.type){if(out.length>=3)break;const w=TYPEKW[c];if(!out.includes(w))out.push(w)}
  return out.slice(0,3);
}
function curve(n){const h=s.hist.length?s.hist:[s.happy];const o=[];for(let i=0;i<n;i++)o.push(h[Math.floor(i*(h.length-1)/(n-1||1))]);return o}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function shareData(){return {t:s.type,a:s.age,ti:title(),r:ratings(),kw:keywords(),c:curve(24)}}
function resultUrl(){const i=Math.max(0,TITLES.indexOf(title()));return SHARE_URL+'r/'+s.type+'-'+i+'/?r='+enc(shareData())}
function xText(){
  return `${s.type}の私の一生は「${title()}」\n享年${s.age}／キーワードは「${keywords().join('・')}」\n\nあなたのMBTIは、どんな一生？\n#16分の1の人生 #MBTI`;
}
function xUrl(){return 'https://x.com/intent/post?text='+encodeURIComponent(xText())+'&url='+encodeURIComponent(resultUrl())}
function shareText(){
  return xText()+'\n'+resultUrl();
}
let friend=null;
try{const r=new URLSearchParams(location.search).get('r');const o=r&&dec(r);if(o&&TYPES[o.t]&&+o.a>0){friend=o;view='friend'}}catch(e){}
function rateHtml(r){return `<div class="rates">${Object.keys(RATE_LABEL).map(k=>{const v=c15(r&&r[k]);return `<div><span>${RATE_LABEL[k][0]}</span><b class="st">${stars(v)}</b><i>${RATE_LABEL[k][1][v-1]}</i></div>`}).join('')}</div>`}
function sparkSvg(c){c=(Array.isArray(c)?c:[]).map(v=>Math.max(0,Math.min(100,+v||0)));if(c.length<2)return '';
  const W=300,H=60,pts=c.map((v,i)=>[(i/(c.length-1))*W,H-4-(v/100)*(H-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<figure class="spark"><figcaption>しあわせの波</figcaption><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H}Z" fill="var(--pink)" opacity=".14"/><path d="${d}" fill="none" stroke="var(--pink)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg></figure>`}
function vFriend(){
  const f=friend,n=v=>Math.max(0,Math.round(+v||0));
  const kw=Array.isArray(f.kw)?f.kw.slice(0,3).map(w=>esc(String(w).slice(0,12))):[];
  return `<span class="eyebrow">シェアされた人生</span>
  <div class="grave dots"><span class="eyebrow">${f.t} ・ ${TYPES[f.t].n}</span><span class="span">享年 ${n(f.a)}</span><h2 class="riso">${esc(String(f.ti||'').slice(0,30))}</h2>
  ${rateHtml(f.r)}
  ${kw.length?`<div class="kws">${kw.map(w=>`<span>#${w}</span>`).join('')}</div>`:''}
  ${sparkSvg(f.c)}</div>
  <div class="friendcta"><h3>あなたのMBTIだと、どんな一生？</h3><p>いまの年齢と状況を入れて、未来を早送り。1分で結果が出ます。</p><button class="btn" data-act="home">自分の人生を見る</button></div>`;
}
function shareTextOld(){
  return `#16分の1の人生\n${s.type}（${TYPES[s.type].n}）の私は、${s.age}歳まで生きて「${title()}」になった。\n職業：${s.job||'—'}／${s.married?'結婚':'独身'}${s.kids?'・子ども'+s.kids+'人':''}／最終貯金 ${fmtMoney(s.money)}\nあなたのタイプは、どんな一生？`;
}
function vEnd(){
  const rel=s.married?'結婚して添い遂げた':(s.ms.some(m=>m[1]==='離婚した')||s.log.some(l=>/離婚を経験/.test(l.text)))?'離婚を経験':s.partner?'恋人と過ごした':'ひとりの時間を愛した';
  return `<div class="grave dots"><span class="eyebrow">${s.type} ・ ${TYPES[s.type].n}</span><span class="span">${s.startAge}歳から早送り ・ 享年 ${s.age}</span><h2 class="riso">${title()}</h2>
  <div class="facts"><div>職業<b>${esc(s.job||'—')}</b></div><div>最高年収<b>${s.maxIncome?fmtMoney(s.maxIncome):'—'}</b></div><div>最終貯金<b>${fmtMoney(s.money)}</b></div><div>学歴<b>${(EDU[s.edu]||EDU.hs)[0]}</b></div><div>家族<b>${rel}</b></div><div>子ども / 孫<b>${s.kids}人 / ${s.grand}人</b></div></div></div>
  <section class="sec"><h3>人生のハイライト</h3><ul class="mslist">${s.ms.map(m=>`<li><span>${m[0]}歳</span>${esc(m[1])}</li>`).join('')||'<li><span>—</span>大きな事件のない、穏やかな人生</li>'}</ul></section>
  <section class="sec"><h3>Xでシェア</h3>
  <p class="note" style="margin:0">シェアされるのは「称号・享年・運勢・キーワード」のイメージだけです。年齢・職業・家族・金額などは載りません。</p>
  <img class="imgcard" id="cardimg" alt="${s.type}・享年${s.age}・${esc(title())} の結果カード">
  <div class="row"><button class="btn small" data-act="nshare" id="nshare" hidden>画像つきでシェア</button><button class="btn small ghost" data-act="saveimg">画像を保存</button></div>
  <ol class="steps"><li>「画像を保存」（スマホは画像を長押しでも可）</li><li>「Xでポスト」を押して、保存した画像を添付</li></ol>
  <div class="row"><a class="xbtn" href="${xUrl()}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.8-6.3L6.4 22H3.3l7.3-8.3L1 2h6.3l4.4 5.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z"/></svg>Xでポスト</a><button class="btn small ghost" data-act="copy">文章をコピー</button></div>
  <textarea class="share" id="sharebox" rows="6" readonly>${esc(shareText())}</textarea></section>
  <div class="row"><button class="btn" data-act="begin" data-type="${s.type}">同じ条件でもう一度</button><button class="btn ghost" data-act="home">別のタイプで</button></div>
  ${TIP_URL?`<div class="quizcta dots"><p><b>おもしろかったら応援してね</b><br>開発のおやつ代になります</p><a class="btn" style="text-decoration:none" href="${TIP_URL}" target="_blank" rel="noopener">開発者を応援する</a></div>`:''}
  <p class="note">同じタイプでも、人生は毎回ちがいます。</p>`;
}
let cardType=null,cardFromQuiz=false;
async function drawCard(){
  const img=document.getElementById('cardimg');if(!img)return;
  try{await Promise.all([document.fonts.load('80px "Dela Gothic One"'),document.fonts.load('700 30px "Zen Kaku Gothic New"'),document.fonts.load('28px "DM Mono"')])}catch(e){}
  const W=1200,H=675,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const P='#F2367F',B='#2D57F0',INK='#1A1D3A',PAPER='#EDEFF5',MUTED='#5E6385',GOLD='#E0A400';
  const D='"Dela Gothic One","Hiragino Sans",sans-serif',BD='"Zen Kaku Gothic New","Hiragino Sans",sans-serif';
  const sd=shareData();
  g.fillStyle=PAPER;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(45,87,240,.16)';for(let y=6;y<H;y+=16)for(let x=(y/16%2)*8+6;x<W;x+=16){g.beginPath();g.arc(x,y,2,0,7);g.fill()}
  g.fillStyle=B;g.fillRect(52,52,W-96,H-96);g.fillStyle='#F8F9FC';g.fillRect(40,40,W-96,H-96);
  g.strokeStyle=INK;g.lineWidth=4;g.strokeRect(40,40,W-96,H-96);
  g.font='150px '+D;g.textBaseline='alphabetic';
  g.fillStyle='rgba(45,87,240,.55)';g.fillText(sd.t,84,224);g.fillStyle=P;g.fillText(sd.t,78,218);
  g.fillStyle=MUTED;g.font='500 26px '+BD;g.fillText(TYPES[sd.t].n,84,266);
  g.save();g.translate(940,150);g.rotate(-0.12);g.strokeStyle=P;g.lineWidth=5;g.beginPath();g.arc(0,0,92,0,7);g.stroke();
  g.fillStyle=P;g.textAlign='center';g.font='26px '+BD;g.fillText('享年',0,-22);g.font='72px '+D;g.fillText(sd.a,0,50);g.restore();
  const tt='「'+sd.ti+'」';let fs=60;g.font=fs+'px '+D;while(g.measureText(tt).width>W-170&&fs>36){fs-=4;g.font=fs+'px '+D}
  g.fillStyle='rgba(242,54,127,.6)';g.fillText(tt,84,356);g.fillStyle=INK;g.fillText(tt,80,352);
  // ratings
  Object.keys(RATE_LABEL).forEach((k,i)=>{const x=84+i*262,v=sd.r[k];
    g.fillStyle=MUTED;g.font='500 22px '+BD;g.fillText(RATE_LABEL[k][0],x,408);
    g.font='30px '+BD;for(let s2=0;s2<5;s2++){g.fillStyle=s2<v?GOLD:'#C9CDE0';g.fillText('★',x+s2*30,446)}
    g.fillStyle=INK;g.font='700 24px '+BD;g.fillText(RATE_LABEL[k][1][v-1],x,482)});
  // keywords
  g.font='700 26px '+BD;let kx=84;
  sd.kw.forEach(w=>{const t='#'+w,tw=g.measureText(t).width+32;g.fillStyle=INK;g.beginPath();g.roundRect(kx,510,tw,46,23);g.fill();g.fillStyle='#fff';g.fillText(t,kx+16,542);kx+=tw+12});
  // happiness curve
  const cx=Math.max(kx+30,640),cw=W-96-cx-20,cy=520,ch=46,cv=sd.c;
  if(cw>120&&cv.length>1){g.fillStyle=MUTED;g.font='500 18px '+BD;g.fillText('しあわせの波',cx,cy-8);
    g.beginPath();cv.forEach((v,i)=>{const x=cx+i/(cv.length-1)*cw,y=cy+ch-v/100*ch;i?g.lineTo(x,y):g.moveTo(x,y)});
    g.strokeStyle=P;g.lineWidth=4;g.lineJoin='round';g.stroke();
    g.lineTo(cx+cw,cy+ch);g.lineTo(cx,cy+ch);g.closePath();g.fillStyle='rgba(242,54,127,.12)';g.fill()}
  g.fillStyle=INK;g.fillRect(40,H-96,W-96,40);g.fillStyle='#fff';g.font='700 22px '+BD;g.textAlign='left';g.fillText('#16分の1の人生',64,H-68);
  g.textAlign='right';g.fillText('あなたのMBTIは、どんな一生？',W-80,H-68);
  img.src=c.toDataURL('image/png');
  try{const nb=document.getElementById('nshare');if(nb&&navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'a.png',{type:'image/png'})]}))nb.hidden=false}catch(e){}
}
function render(){
  app.innerHTML=view==='home'?vHome():view==='quiz'?vQuiz():view==='card'?vCard(cardType,cardFromQuiz):view==='setup'?vSetup(cardType):view==='friend'?vFriend():view==='life'?vLife():vEnd();
  app.classList.toggle('wide',view==='life');
  if(view==='life')startScene();
  if(view==='setup')syncSetup();
  if(view==='end')drawCard();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,1600)}

document.addEventListener('keydown',e=>{if(view==='life'&&pending&&/^[1-4]$/.test(e.key)&&pending.o[+e.key-1]){resolve(+e.key-1);render()}});
app.addEventListener('input',e=>{if(e.target.id==='age')syncSetup()});
app.addEventListener('change',e=>{if(e.target.name==='status')syncSetup()});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.type&&!b.dataset.act){cardType=b.dataset.type;cardFromQuiz=false;view='card';render();scrollTo(0,0);return}
  if(b.dataset.ans){qa.push(b.dataset.ans);qi++;
    if(qi>=QUIZ.length){const c=k=>qa.filter(x=>x===k).length;cardType=(c('E')>=2?'E':'I')+(c('S')>=2?'S':'N')+(c('T')>=2?'T':'F')+(c('J')>=2?'J':'P');cardFromQuiz=true;view='card'}
    render();return}
  if(b.dataset.choose){resolve(+b.dataset.choose);render();return}
  if(b.dataset.speed){speed=+b.dataset.speed;untilChoice=false;if(!pending&&!s.dead)play();render();return}
  const a=b.dataset.act;
  if(a==='home'){stop();if(friend){friend=null;try{history.replaceState(null,'',location.pathname)}catch(e){}}view='home';render();scrollTo(0,0)}
  if(a==='setup'){cardType=b.dataset.type;view='setup';render();scrollTo(0,0)}
  if(a==='quiz'){qi=0;qa=[];view='quiz';render();scrollTo(0,0)}
  if(a==='begin'){stop();pending=null;autoSkip=false;speed=1;const p=view==='setup'?readSetup():prof;startLife(b.dataset.type,p);
    view='life';render();scrollTo(0,0);if(!pending)play()}
  if(a==='quick'){stop();autoSkip=true;pending=null;startLife(b.dataset.type,readSetup());
    if(pending){const i=pending.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i)}
    let guard=0;while(!s.dead&&guard++<200){step()}
    view='end';render();scrollTo(0,0);return}
  if(a==='saveimg'){const im=document.getElementById('cardimg');if(!im.src)return;const l=document.createElement('a');l.href=im.src;l.download='16bun1_'+s.type+'_'+s.age+'.png';document.body.appendChild(l);l.click();l.remove();toast('画像を保存しました');return}
  if(a==='nshare'){const im=document.getElementById('cardimg');fetch(im.src).then(r=>r.blob()).then(bl=>{const f=new File([bl],'16bun1.png',{type:'image/png'});return navigator.share({files:[f],text:shareText()})}).catch(()=>{});return}
  if(a==='toggle'){timer?stop():play();render()}
  if(a==='next'){if(pending)return;untilChoice=true;play();render()}
  if(a==='autotoggle'){autoSkip=!autoSkip;if(autoSkip&&pending){const i=pending.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i)}render()}
  if(a==='auto'){autoSkip=true;const i=pending.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i);render()}
  if(a==='toend'){stop();view='end';render();scrollTo(0,0)}
  if(a==='skip'){stop();autoSkip=true;if(pending){const i=pending.o.findIndex(o=>s.t[o.lean]);resolve(i<0?0:i)}let g=0;while(!s.dead&&g++<200){step()}stop();view='end';render();scrollTo(0,0)}
  if(a==='copy'){const t=shareText();const box=document.getElementById('sharebox');
    navigator.clipboard?.writeText(t).then(()=>toast('コピーしました'),()=>{box.select();toast('選択しました。長押しでコピーしてください')})??(box.select(),toast('選択しました'))}
});
render();
